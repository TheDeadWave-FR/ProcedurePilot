[package]
name = "procedure-pilot"
version = "2.0.0"
edition = "2024"
description = "Procedure Pilot — gestion documentaire portable en Rust"

[[bin]]
name = "ProcedurePilot"
path = "src/main.rs"

[dependencies]
anyhow = "1"
base64 = "0.22"
chrono = "0.4"
eframe = { version = "0.31.1", default-features = false, features = ["default_fonts", "glow", "x11", "wayland"] }
egui_extras = "0.31.1"
image = { version = "0.25", default-features = false, features = ["png"] }
pathdiff = "0.2"
rfd = "0.15"
roxmltree = "0.20"
tempfile = "3"
url = "2"
uuid = { version = "1", features = ["v4"] }
walkdir = "2"
zip = { version = "2", default-features = false, features = ["deflate"] }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.58", features = ["Win32_System_Com", "Win32_System_Ole", "Win32_System_Variant"] }

[profile.release]
lto = "thin"
strip = true
codegen-units = 1

[build-dependencies]
embed-resource = "3"
image = { version = "0.25", default-features = false, features = ["png", "ico"] }
